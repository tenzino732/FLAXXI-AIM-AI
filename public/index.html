<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AimAi Key Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b0b0f;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            background: #14141d;
            border: 1px solid rgba(255, 0, 85, 0.3);
            box-shadow: 0 0 25px rgba(255, 0, 85, 0.2);
            border-radius: 16px;
            width: 100%;
            max-width: 420px;
            padding: 25px;
            text-align: center;
        }
        h2 {
            color: #ff0055;
            margin-bottom: 25px;
            font-size: 24px;
            letter-spacing: 0.5px;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 8px;
        }
        .input-row {
            display: flex;
            gap: 8px;
        }
        input, select {
            width: 100%;
            padding: 12px 15px;
            background: #1e1e2d;
            border: 1px solid #2a2a3d;
            color: #fff;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        input:focus, select:focus {
            border-color: #ff0055;
        }
        .gen-btn {
            background: #2a2a3d;
            border: 1px solid #ff0055;
            color: #ff0055;
            padding: 0 15px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            white-space: nowrap;
            transition: 0.2s;
        }
        .gen-btn:hover {
            background: #ff0055;
            color: #fff;
        }
        .submit-btn {
            width: 100%;
            background: linear-gradient(135deg, #ff0055, #cc0044);
            border: none;
            color: white;
            padding: 14px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            transition: 0.2s;
            margin-top: 10px;
        }
        .submit-btn:hover {
            opacity: 0.9;
        }
        #response-msg {
            margin-top: 15px;
            font-size: 14px;
        }
        .keyList {
            margin-top: 25px;
            text-align: left;
            max-height: 150px;
            overflow-y: auto;
            border-top: 1px solid #2a2a3d;
            padding-top: 10px;
        }
        .keyList h4 {
            font-size: 13px;
            color: #888;
            margin-bottom: 5px;
        }
        .key-item {
            background: #1a1a26;
            padding: 6px 10px;
            border-radius: 5px;
            font-size: 12px;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            color: #00ffcc;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AimAi Key Manager</h2>
        
        <div class="form-group">
            <label>Generate Key / Username</label>
            <div class="input-row">
                <input type="text" id="keyInput" placeholder="Enter or Generate Key" value="TENZINO-PRO-2029">
                <button type="button" class="gen-btn" onclick="generateRandomKey()">Auto Gen</button>
            </div>
        </div>

        <div class="form-group">
            <label>Select Validity (Duration)</label>
            <select id="validityInput">
                <option value="30 Days">30 Days</option>
                <option value="60 Days">60 Days</option>
                <option value="90 Days">90 Days</option>
                <option value="Lifetime">Lifetime</option>
            </select>
        </div>

        <div class="form-group">
            <label>Device Limit</label>
            <select id="deviceInput">
                <option value="1 Device">1 Device</option>
                <option value="2 Devices">2 Devices</option>
                <option value="Unlimited">Unlimited</option>
            </select>
        </div>

        <button type="button" class="submit-btn" onclick="createKey()">Create Key</button>
        
        <div id="response-msg"></div>

        <div class="keyList">
            <h4>Generated Keys History</h4>
            <div id="keysContainer">
                <div class="key-item"><span>TENZINO-PRO-2029</span><span>30 Days</span></div>
            </div>
        </div>
    </div>

    <script>
        // ऑटोमैटिक रैंडम की जेनरेट करने का फंक्शन
        function generateRandomKey() {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
            let randomPart = "";
            for (let i = 0; i < 6; i++) {
                randomPart += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('keyInput').value = "TENZINO-" + randomPart;
        }

        async function createKey() {
            const key = document.getElementById('keyInput').value;
            const validity = document.getElementById('validityInput').value;
            const deviceLimit = document.getElementById('deviceInput').value;
            const msgDiv = document.getElementById('response-msg');

            try {
                const response = await fetch('/api/create-key', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ key, validity, deviceLimit })
                });
                const data = await response.json();
                
                if(data.status === 'success') {
                    msgDiv.style.color = "#00ffcc";
                    msgDiv.innerText = data.message;
                    
                    // नीचे लिस्ट में भी की जोड़ दें
                    const container = document.getElementById('keysContainer');
                    container.innerHTML += `<div class="key-item"><span>${key}</span><span>${validity}</span></div>`;
                } else {
                    msgDiv.style.color = "#ff0055";
                    msgDiv.innerText = data.message || "Failed to create key";
                }
            } catch (err) {
                msgDiv.style.color = "#ff0055";
                msgDiv.innerText = "Network error occurred!";
            }
        }
    </script>
</body>
</html>
