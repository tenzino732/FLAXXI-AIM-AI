<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AimAi Key Manager</title>
    <style>
        body { 
            background-color: #07070a; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            overflow: hidden;
            position: relative;
        }

        /* Deadly / Dark Crimson Animated Background Glow */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(220, 20, 60, 0.25) 0%, rgba(15, 5, 10, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseGlow 4s infinite alternate ease-in-out;
            z-index: -1;
        }

        @keyframes pulseGlow {
            0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; }
            100% { transform: translate(-50%, -50%) scale(1.3); opacity: 0.9; }
        }

        .card { 
            background: rgba(18, 18, 26, 0.85); 
            backdrop-filter: blur(10px);
            padding: 25px; 
            border-radius: 14px; 
            width: 320px; 
            box-shadow: 0 0 25px rgba(220, 20, 60, 0.3), inset 0 0 10px rgba(220, 20, 60, 0.1); 
            border: 1px solid rgba(220, 20, 60, 0.4);
            position: relative; 
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h2 { 
            text-align: center; 
            color: #ff1e4d; 
            margin-bottom: 20px; 
            text-shadow: 0 0 10px rgba(255, 30, 77, 0.5);
            font-size: 22px;
            letter-spacing: 0.5px;
        }

        label { 
            font-size: 12px; 
            color: #a0a0ab; 
            display: block; 
            margin-top: 10px; 
        }

        input, select { 
            width: 100%; 
            padding: 10px; 
            margin-top: 5px; 
            background: #121218; 
            border: 1px solid #2d2d3d; 
            color: #fff; 
            border-radius: 6px; 
            box-sizing: border-box; 
            transition: border-color 0.3s;
        }

        input:focus, select:focus {
            border-color: #ff1e4d;
            outline: none;
            box-shadow: 0 0 8px rgba(255, 30, 77, 0.4);
        }

        button { 
            width: 100%; 
            background: linear-gradient(135deg, #cc0033, #880022); 
            color: #fff; 
            border: none; 
            padding: 12px; 
            margin-top: 20px; 
            border-radius: 6px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
            box-shadow: 0 4px 12px rgba(204, 0, 51, 0.4);
        }

        button:hover { 
            background: linear-gradient(135deg, #ff1e4d, #cc0033);
            box-shadow: 0 6px 18px rgba(255, 30, 77, 0.6);
        }

        .settings-btn { 
            position: absolute; 
            top: 20px; 
            right: 20px; 
            background: none; 
            border: none; 
            color: #a0a0ab; 
            cursor: pointer; 
            font-size: 18px; 
            width: auto; 
            margin: 0; 
            padding: 0; 
            transition: transform 0.3s, color 0.3s;
        }

        .settings-btn:hover { 
            color: #ff1e4d; 
            transform: rotate(90deg);
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <!-- Admin Login Screen -->
    <div id="loginScreen" class="card">
        <h2>Admin Login</h2>
        <label>Username</label>
        <input type="text" id="loginUser" placeholder="Enter username">
        
        <label>Password</label>
        <input type="password" id="loginPass" placeholder="Enter password">

        <button onclick="loginAdmin()">Login</button>
    </div>

    <!-- Main Key Manager Dashboard -->
    <div id="dashboardScreen" class="card hidden">
        <button class="settings-btn" onclick="openSettings()">⚙️</button>
        <h2>AimAi Key Manager</h2>
        
        <label>Generate Key / Username</label>
        <input type="text" id="keyInput" placeholder="Enter key">
        
        <label>Select Validity (Duration)</label>
        <select id="validityInput">
            <option value="1 Day">1 Day</option>
            <option value="7 Days">7 Days</option>
            <option value="30 Days">30 Days</option>
        </select>

        <label>Device Limit</label>
        <select id="deviceInput">
            <option value="1 Device">1 Device</option>
            <option value="2 Devices">2 Devices</option>
        </select>

        <button onclick="createKey()">Create Key</button>
    </div>

    <!-- Settings Screen (To edit Username & Password) -->
    <div id="settingsScreen" class="card hidden">
        <button class="settings-btn" onclick="closeSettings()" style="font-size: 14px;">✕ Back</button>
        <h2>Admin Settings</h2>
        
        <label>New Username</label>
        <input type="text" id="newUsername">

        <label>New Password</label>
        <input type="password" id="newPassword">

        <button onclick="updateCredentials()">Save Settings</button>
    </div>

    <script>
        // Set the default credentials explicitly here
        let adminUser = "Tenzino";
        let adminPass = "Tenzino@766";

        function loginAdmin() {
            const u = document.getElementById('loginUser').value;
            const p = document.getElementById('loginPass').value;

            if (u === adminUser && p === adminPass) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('dashboardScreen').classList.remove('hidden');
            } else {
                alert("Invalid Username or Password!");
            }
        }

        function openSettings() {
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('settingsScreen').classList.remove('hidden');
            // Populate the input fields with the current values when the settings screen is opened
            document.getElementById('newUsername').value = adminUser;
            document.getElementById('newPassword').value = adminPass;
        }

        function closeSettings() {
            document.getElementById('settingsScreen').classList.add('hidden');
            document.getElementById('dashboardScreen').classList.remove('hidden');
        }

        function updateCredentials() {
            const newU = document.getElementById('newUsername').value;
            const newP = document.getElementById('newPassword').value;

            if (newU && newP) {
                adminUser = newU;
                adminPass = newP;
                alert("Credentials updated successfully!");
                closeSettings();
            } else {
                alert("Fields cannot be empty!");
            }
        }

        function createKey() {
            const key = document.getElementById('keyInput').value;
            if (!key) {
                alert("Please enter a key!");
                return;
            }
            alert("Key '" + key + "' created successfully!");
        }
    </script>
</body>
</html>
